[project]
name = "rp2040-temp-monitor-docs"
version = "0.1.0"
description = "RP2040 Temperature Monitor - documentation"
requires-python = ">=3.12"
dependencies = [
    "sphinx>=7.0",
    "sphinx-needs[plotting]>=2.1",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
    "sphinxcontrib-plantuml>=0.30",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mcp>=2.2.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ 直下のモジュール（needs_query など）を import できるようにする
pythonpath = ["scripts"]
